<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Історія операцій</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-top: 20px;}
        th, td { padding: 12px 15px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>

<h2>Історія останніх обмінів</h2>

<table>
    <thead>
    <tr>
        <th>Час</th>
        <th>Віддано</th>
        <th>Отримано</th>
        <th>Статус</th>
    </tr>
    </thead>
    <tbody id="historyBody">
    </tbody>
</table>

<br>
<a href="index.html" style="text-decoration: none; color: #007bff; font-weight: bold;">⬅ Повернутися до конвертації</a>

<script>
    fetch('/api/history')
        .then(response => response.json())
        .then(data => {
            const tbody = document.getElementById('historyBody');

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Операцій ще не було. Зробіть свій перший обмін!</td></tr>';
                return;
            }

            for (let i = data.length - 1; i >= 0; i--) {
                const op = data[i];
                const row = `<tr>
                    <td>${op.time}</td>
                    <td>${op.amountGiven.toFixed(2)} ${op.fromCurrency}</td>
                    <td>${op.amountReceived.toFixed(2)} ${op.toCurrency}</td>
                    <td>${op.error}</td>
                </tr>`;
                tbody.innerHTML += row;
            }
        })
        .catch(error => {
            console.error('Помилка завантаження історії:', error);
            document.getElementById('historyBody').innerHTML = '<tr><td colspan="4" style="text-align: center; color: red;">Помилка завантаження даних із сервера</td></tr>';
        });
</script>
</body>
</html>
